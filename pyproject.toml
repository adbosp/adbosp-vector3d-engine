[project]
name = "vector3d-engine"
version = "0.3.0"
description = "Photos and orthographic drawings to 3D meshes, math first and AI where needed"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "scikit-image>=0.21", "Pillow>=10", "onnxruntime>=1.17"]

[project.optional-dependencies]
dev = ["pytest>=7", "onnx>=1.15"]
ai = ["rembg>=2.0.50"]

[project.scripts]
vector3d = "vector3d.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vector3d*"]

[tool.setuptools.package-data]
"vector3d.ui" = ["static/*"]
